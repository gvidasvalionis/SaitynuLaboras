<!-- filepath: frontend/public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E10600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a00400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#15151E" stroke="url(#redGradient)" stroke-width="3"/>
  
  <!-- F1 text -->
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="45" font-weight="bold" fill="url(#redGradient)" text-anchor="middle">
    F1
  </text>
  
  <!-- Racing stripes -->
  <rect x="15" y="25" width="70" height="4" fill="url(#redGradient)" opacity="0.8"/>
  <rect x="20" y="32" width="60" height="3" fill="url(#redGradient)" opacity="0.6"/>
</svg>