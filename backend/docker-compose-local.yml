services:
  db:
    image: mysql:latest
    container_name: f1_db
    ports:
      - "${DB_PORT}:3306"
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: